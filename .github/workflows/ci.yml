name: CI

# Runs the checks that previously had to be done by hand, in a sandbox that
# is rebuilt from scratch each session and does not persist. This is the
# main reason this repo exists: dart analyze / flutter test / connect_audit
# now run automatically on every push and pull request, not "whenever
# someone happens to install Flutter locally."

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter_app:
    name: Flutter app — analyze, test, static audit, web + Android builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact patch, not `channel: stable` — that tracks
      # whatever is current on the day CI happens to run, which is
      # reproducible only on that day, not over time. See .fvmrc for the
      # single source of truth this value must match.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: dart analyze
        working-directory: flutter_app
        run: dart analyze

      - name: flutter test
        working-directory: flutter_app
        run: flutter test

      - name: Core mode data boundary regression
        working-directory: flutter_app
        run: flutter test test/live_mode_test.dart --dart-define=BINNACLE_APP_MODE=core --dart-define=BINNACLE_CORE_URL=https://core.invalid

      - name: flutter build web (proves it actually compiles end to end)
        working-directory: flutter_app
        run: flutter build web

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flutter_app/build/web
          retention-days: 14

      - name: connect_audit.py static policy audit
        run: python3 tools/connect_audit/connect_audit.py flutter_app/lib

      - name: connect_audit.py self-test (fixtures must still block/pass correctly)
        working-directory: tools/connect_audit
        run: bash run_tests.sh

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: flutter build apk --debug (second acceptance gate — see README)
        working-directory: flutter_app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # A prior BIN-32 attempt reported this environment-blocked (an
      # installed NDK compiler that couldn't execute) — see README history.
      # Re-verified locally as of this commit: it genuinely succeeds now,
      # producing a real signed-debug-key release APK, closing one of
      # BIN-32's explicitly-named remaining gates ("produce and verify an
      # Android release build"). This is NOT the physical acceptance gate —
      # running on real hardware against a real Core is still separately
      # required.
      - name: flutter build apk --release
        working-directory: flutter_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  web_dashboard:
    name: Web dashboard — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci
        working-directory: web_dashboard
        run: npm ci

      - name: npm run build
        working-directory: web_dashboard
        run: npm run build
