name: binnacle_connect
description: Binnacle Connect — phone and cloud companion app for Vision/Track.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2          # ChangeNotifier-based state management
  web_socket_channel: ^3.0.3 # Control channel (WSS) + telemetry socket
  uuid: ^4.4.0               # Command id generation, per protocol §5
  intl: ^0.19.0              # Timestamp / duration formatting
  google_fonts: ^6.2.1       # Space Grotesk / Inter / JetBrains Mono to match design language
  http: ^1.2.2               # Real Core pairing transport (HTTPS POST) — see pairing_transport.dart
  mobile_scanner: ^5.2.3     # Real camera QR scanning for pairing — see pairing_screen.dart
  flutter_secure_storage: ^9.2.2 # Keychain/Keystore-backed credential persistence — see pairing_service.dart
  basic_utils: ^5.7.0        # Real EC keypair generation + PEM/CSR encoding — see pairing_service.dart's SecureKeyMaterial
  pointycastle: ^4.0.0       # EC key types (ECPrivateKey/ECPublicKey) used directly by SecureKeyMaterial

  flutter_webrtc: ^1.6.2+hotfix.3 # Real PeerConnection/media rendering — see lib/core/services/webrtc_service.dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
