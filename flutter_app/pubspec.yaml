name: binnacle_connect
description: Binnacle Connect — phone and cloud companion app for Vision/Track.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2          # ChangeNotifier-based state management
  web_socket_channel: ^3.0.3 # Control channel (WSS) + telemetry socket
  uuid: ^4.4.0               # Command id generation, per protocol §5
  intl: ^0.19.0              # Timestamp / duration formatting
  google_fonts: ^6.2.1       # Space Grotesk / Inter / JetBrains Mono to match design language
  http: ^1.2.2               # Real Core pairing transport (HTTPS POST) — see pairing_transport.dart
  mobile_scanner: ^5.2.3     # Real camera QR scanning for pairing — see pairing_screen.dart
  flutter_secure_storage: ^9.2.2 # Keychain/Keystore-backed credential persistence — see pairing_service.dart
  basic_utils: ^5.7.0        # Real EC keypair generation + PEM/CSR encoding — see pairing_service.dart's SecureKeyMaterial
  pointycastle: ^4.0.0       # EC key types (ECPrivateKey/ECPublicKey) used directly by SecureKeyMaterial

  flutter_webrtc: ^1.6.2+hotfix.3 # Real PeerConnection/media rendering — see lib/core/services/webrtc_service.dart
  video_player: ^2.9.2       # Real Library clip playback — see lib/ui/screens/library_screen.dart
  share_plus: ^10.1.2        # Real clip sharing — see lib/ui/screens/library_screen.dart
  url_launcher: ^6.3.1       # Real clip download (opens the Core media URL) — see lib/ui/screens/library_screen.dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Real GoPro development footage (VER-01), bundled so demo mode has a
    # genuinely playable Library clip instead of a dead mediaUrl — see
    # library_screen.dart's seedDemo(). Clearly a demo asset, never
    # presented as Core-backed media (mediaUrl for a real clip only ever
    # comes from HttpMediaCatalogService, a real Core fetch).
    - assets/demo/gopro_dev_footage.mp4
    # Brand background used behind ambient/dashboard-style screens — see
    # binnacle_background.dart. Deliberately not used behind the Live
    # camera view or Library's dense grid, where real media is the point.
    - assets/backgrounds/wave_glow.png
    # Original transparent Binnacle Marine Systems shield/compass mark.
    # Preserved as-is (dark-navy lettering, suited to light/neutral
    # backgrounds); not currently referenced by any screen — see
    # binnacle_logo_dark_bg.png below for the splash's actual asset.
    - assets/brand/binnacle_logo.png
    # Dark-background variant: same shield/compass, unchanged, with the
    # BINNACLE / MARINE SYSTEMS lettering relit to a bright brushed-silver
    # dimensional treatment for legibility against the splash's navy/wave
    # background — see connect_startup.dart, the only current user.
    - assets/brand/binnacle_logo_dark_bg.png
